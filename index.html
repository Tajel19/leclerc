<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leclerc Depression Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            text-align: center; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #111111; 
            color: white; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .image-container {
            margin: 15px 0;
        }
        #leclerc { 
            width: 220px; 
            height: 220px;
            cursor: pointer; 
            transition: transform 0.05s ease; 
            border-radius: 50%; 
            border: 5px solid #e00000;
            object-fit: cover;
            box-shadow: 0 0 25px rgba(224, 0, 0, 0.5);
            -webkit-tap-highlight-color: transparent;
        }
        #leclerc:active { 
            transform: scale(0.94); 
        }
        .stats { 
            font-size: 20px; 
            margin: 15px 0; 
            font-weight: 600;
        }
        .stats span { 
            color: #e00000; 
        }
        button { 
            padding: 15px 30px; 
            background: #e00000; 
            color: white; 
            border: none; 
            border-radius: 12px; 
            font-size: 17px;
            font-weight: bold;
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(224, 0, 0, 0.3);
            -webkit-tap-highlight-color: transparent;
        }
        button:active { 
            transform: scale(0.97);
            background: #b30000;
        }
    </style>
</head>
<body>

    <h1>Leclerc Clicker</h1>
    
    <div class="image-container">
        <img id="leclerc" src="leclerc.png" alt="Charles Leclerc">
    </div>
    
    <div class="stats">
        Очки депрессии: <span id="score">0</span><br>
        Уровень болида: <span id="level">1</span>
    </div>
    
    <div>
        <button onclick="upgrade()">Улучшить болид (Цена: <span id="cost">10</span>)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        let level = 1;
        let cost = 10;

        const leclerc = document.getElementById('leclerc');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const costEl = document.getElementById('cost');

        leclerc.onclick = () => {
            score += level;
            scoreEl.innerText = score;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        };

        function upgrade() {
            if (score >= cost) {
                score -= cost;
                level++;
                cost = Math.floor(cost * 1.7);
                scoreEl.innerText = score;
                levelEl.innerText = level;
                costEl.innerText = cost;
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                tg.showAlert("Недостаточно очков депрессии!");
            }
        }
    </script>
</body>
</html>
