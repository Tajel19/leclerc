<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leclerc Depression Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            text-align: center; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: #111111; 
            color: white; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .image-container {
            margin: 15px 0;
        }
        #leclerc { 
            width: 240px; 
            height: 240px;
            cursor: pointer; 
            transition: transform 0.05s ease; 
            border-radius: 50%; 
            border: 5px solid #e00000;
            
            object-fit: cover;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            
            box-shadow: 0 0 30px rgba(224, 0, 0, 0.6);
            -webkit-tap-highlight-color: transparent;
        }
        #leclerc:active { 
            transform: scale(0.92); 
        }
        .stats { 
            font-size: 22px; 
            margin: 15px 0; 
            font-weight: 600;
        }
        .stats span { 
            color: #e00000; 
            text-shadow: 0 0 10px rgba(224, 0, 0, 0.3);
        }
        button { 
            padding: 16px 32px; 
            background: #e00000; 
            color: white; 
            border: none; 
            border-radius: 14px; 
            font-size: 18px;
            font-weight: bold;
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(224, 0, 0, 0.4);
            -webkit-tap-highlight-color: transparent;
        }
        button:active { 
            transform: scale(0.96);
            background: #b30000;
        }
    </style>
</head>
<body>

    <h1>Leclerc Clicker</h1>
    
    <div class="image-container">
        <img id="leclerc" src="charles.png" alt="Charles Leclerc">
    </div>
    
    <div class="stats">
        Очки депрессии: <span id="score">0</span><br>
        Уровень депрессии: <span id="level">1</span>
    </div>
    
    <div>
        <button onclick="upgrade()">Увеличить депрессию (Цена: <span id="cost">10</span>)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        let level = 1;
        let cost = 10;

        const leclerc = document.getElementById('leclerc');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const costEl = document.getElementById('cost');

        // Функция для сохранения данных в облако Telegram
        function saveData() {
            if (tg.CloudStorage) {
                tg.CloudStorage.setItem('score', score.toString());
                tg.CloudStorage.setItem('level', level.toString());
                tg.CloudStorage.setItem('cost', cost.toString());
            }
        }

        // Функция загрузки данных при старте игры
        function loadData() {
            if (tg.CloudStorage) {
                tg.CloudStorage.getItems(['score', 'level', 'cost'], function(error, values) {
                    if (!error) {
                        if (values.score) score = parseInt(values.score);
                        if (values.level) level = parseInt(values.level);
                        if (values.cost) cost = parseInt(values.cost);
                        
                        // Обновляем интерфейс загруженными данными
                        scoreEl.innerText = score;
                        levelEl.innerText = level;
                        costEl.innerText = cost;
                    }
                });
            }
        }

        // Загружаем прогресс сразу при открытии
        loadData();

        leclerc.onclick = () => {
            score += level;
            scoreEl.innerText = score;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            saveData(); // Сохраняем очки после каждого клика
        };

        function upgrade() {
            if (score >= cost) {
                score -= cost;
                level++;
                cost = Math.floor(cost * 1.7);
                
                scoreEl.innerText = score;
                levelEl.innerText = level;
                costEl.innerText = cost;
                
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                saveData(); // Сохраняем уровень и новую цену
            } else {
                tg.showAlert("Недостаточно очков депрессии!");
            }
        }
    </script>
</body>
</html>
